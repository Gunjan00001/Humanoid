name: Deploy viewers to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enables GitHub Pages for the repo if it is not enabled yet (uses the
      # workflow GITHUB_TOKEN with pages:write - no personal token needed).
      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stage only the published web artifacts (viewers + media). Deliberately
      # excludes .ply / .mp4 / cache so the artifact stays small and no Git LFS
      # smudging is required - the viewers are self-contained.
      - name: Stage site
        run: |
          set -e
          mkdir -p _site/outputs
          ( cd outputs && find . -type f \
              \( -name 'viewer.html' -o -name 'change.gif' \
                 -o -name 'change_*.png' -o -name 'report.json' -o -name 'report.md' \
                 -o -name 'summary.*' -o -name 'checking_sheet.*' \) \
              -exec cp --parents {} ../_site/outputs/ \; )
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><title>3D Scene Change Detection</title>' \
            '<h1>3D Scene Change Detection &mdash; interactive viewers</h1><ul>' \
            '<li><a href="outputs/viewer.html">demo</a></li>' \
            '<li><a href="outputs/scene2/viewer.html">scene2</a></li>' \
            '<li><a href="outputs/scene2_geo/viewer.html">scene2 geometric</a></li>' \
            '<li><a href="outputs/scene3/viewer.html">scene3</a></li>' \
            '<li><a href="outputs/scene4/viewer.html">scene4</a></li>' \
            '<li><a href="outputs/scene5/viewer.html">scene5 (held-out)</a></li>' \
            '<li><a href="outputs/scene6/viewer.html">scene6 (held-out)</a></li>' \
            '</ul>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
