# ---------------------------------------------------------------------------
# 3D Scene Change Detection - single source of tunables.
# Every model name, path and threshold lives here; scripts must not hard-code
# values. Values are starting points and get tuned against the demo scene.
#
# Paths may be relative (resolved against the repo root) or start with `~`.
# ---------------------------------------------------------------------------

seed: 0

paths:
  video_a: data/a.mp4
  video_b: data/b.mp4
  cache_dir: cache
  out_dir: outputs
  model_dir: ~/models        # shared weights folder (see scripts/download_models.sh)

frames:
  fps: 3.0                   # sampling rate from the source video (2.0 gave
                             # too few B frames for a smooth reconstruction)
  max_frames_per_video: 30   # hard cap after blur filtering (evenly spaced)
  blur_threshold: 100.0      # Laplacian variance; blurrier frames are dropped
  min_frames: 8              # fail if fewer frames survive sampling
  jpeg_quality: 92

reconstruction:
  backend: vggt              # vggt | mapanything | mast3r | colmap
  use_icp_refinement: true   # run src/align.py after reconstruction (the demo
                             # scene needed it: static mean NN 15mm -> 11mm)
  device: cuda
  gpu_index: null            # pin a specific GPU id (shared node, see gpu.md)
  conf_percentile: 50.0      # keep points with confidence >= this percentile
  input_mode: crop           # crop | pad - VGGT preprocessing: "crop" discards
                             # the top/bottom of portrait frames (56% of the
                             # frame reaches the model); "pad" keeps the whole
                             # frame at lower resolution (see docs/results.md,
                             # Step-0 diagnosis)
  icp_max_correspondence: 0.05
  icp_iterations: 30
  # MapAnything backend: runs as a subprocess in an isolated conda env because
  # its dependency pins conflict with the main env (see docs/models.md and
  # scripts/run_mapanything.py)
  mapanything:
    env_python: ~/miniconda3/envs/spatialdiff-ma/bin/python
    memory_efficient_inference: true
    minibatch_size: null     # null = dynamic; set 1 for smallest GPU memory
    use_amp: true
    amp_dtype: bf16
    apply_confidence_mask: false

models:
  vggt: facebook/VGGT-1B
  mapanything: facebook/map-anything-apache   # Apache-2.0 checkpoint (docs/models.md)
  vlm_primary: Qwen/Qwen3-VL-32B-Instruct
  vlm_fallback: Qwen/Qwen3-VL-8B-Instruct
  matcher: facebook/dinov2-large
  # Resolution rule (src/common.py:resolve_model): a path is expanded and used
  # as-is; an HF repo id is first tried as <model_dir>/<basename>, then used as
  # a repo id (login node only - compute nodes may have no internet).

diff:
  method: tabletop           # geometric | tabletop (see src/tabletop.py)
  # geometric: 3D nearest-neighbour distance between the two clouds.
  # tabletop: appearance comparison over the dominant plane - needed because
  # VGGT absorbs objects thinner than its patch scale (~1.4cm here); the comb
  # and pen are 1cm thick and do not exist in the depth maps.
  #
  # geometric parameters (also used by align.py):
  voxel_size: 0.006          # metres (reconstruction scale is approximate)
  change_distance: 0.012     # NN distance above which a point is a candidate
  dbscan_eps: 0.025          # ~4 voxels radius
  dbscan_min_points: 12      # flat surfaces at 6mm voxels give ~40-60 points
                             # in a 2.5cm radius; 12 stays off the knife's edge
  outlier_nb_neighbors: 12   # statistical outlier removal on candidates
  outlier_std_ratio: 2.0
  min_cluster_points: 25     # discard clusters smaller than this
  visibility_check: true     # occlusion-aware classification
  visibility_tol: 0.006      # depth tolerance when testing "seen empty"
  visibility_min_fraction: 0.15  # fraction of cluster points that must be seen empty

  # tabletop (photometric) parameters:
  tabletop:
    cell_size: 0.005         # raster cell over the dominant plane
    height_band: 0.15        # only points within +/-15cm of the plane count
                             # (walls/floor share the x/y footprint in
                             # room-scale clouds like MapAnything's)
    min_cell_points: 5       # a cell needs this many points in each video
    objectness_threshold: 70 # colour distance from the fitted table colour
    objectness_margin: 40    # |objA - objB| needed for removed/added
    ratio_threshold: 100     # relative-colour distance for "replaced"
    dbscan_eps_cells: 2.0
    dbscan_min_samples: 8
    min_cells: 18            # discard smaller blobs
    min_cells_unverified: 10 # one-video-only objects can be thin (e.g. a pen)
    boundary_erode_cells: 0  # 0 = no erosion; the masks already require the other video to show table
    ring_hole_ratio: 0.4     # static objects appear as rings - drop them
    max_points_per_cell: 50

semantics:
  vlm: primary               # primary | fallback
  matcher: dinov2
  composite_match_distance: 0.15  # a replaced claim whose two sides each match
                             # an independent confirmed change within this
                             # distance is a composite, not a replacement
  match_similarity_threshold: 0.65  # DINOv2 crop similarity for a move pair;
                             # calibrated: the same apple seen from two angles
                             # scores 0.70, different objects (comb vs pen)
                             # score 0.13. The VLM move question is the final
                             # arbiter for pairs in the 0.65-0.75 band.
  match_min_distance: 0.10   # a "moved" pair must have moved at least this far
  same_appearance_threshold: 0.80  # before/after crops more similar than this
                             # are the same appearance -> not a change
  min_change_score: 80       # removed/added candidates need at least this much
                             # colour evidence (weak fragments are noise)
  reclassify_empty_fraction: 0.15   # 'replaced' with >= this fraction of its
                             # points seen empty by the other video -> removed
                             # (calibrated: chair 0.21 vs remote 0.00)
  reclassify_occupied_fraction: 0.15  # 'removed' with <= this fraction seen
                             # empty (occupied) -> replaced if the other view
                             # names an object (calibrated: apple/cup 0.01 vs
                             # comb 0.73)
  crop_occlusion_tol: 0.15   # crop framing: a point counts as in-view when it
                             # is not behind the observed surface by more than
                             # this (works for removed objects too)
  replaced_min_pixel_diff: 70  # a real flip/replacement changes the pixels
                             # strongly; blur/exposure differences score low
  crop_margin: 0.25          # margin around the projected crop, relative to size
  min_crop_pixels: 48
  verify_crop_margin: 0.4     # verification crops: tight enough that both
                             # views frame the same region (large margins can
                             # catch a neighbour object in only one view)
  verify_min_crop_pixels: 140
  max_crop_frames: 40        # cap frames scanned for the best view
  use_sam2: false            # stretch goal: SAM 2 masks before cropping

visualize:
  conf_percentile: 5.0       # DISPLAY cloud cutoff - lower than the detection
                             # cutoff; the detection pipeline keeps its own
  voxel_size: 0.008          # display resolution (finer than diff.voxel_size)
  static_dim: 0.8            # keep true colours (0.35 was the dark-sliver cause)
  max_background_points: 150000
  splat_size: 20             # marker size at the framing distance (1/z scaled)
  orbit_elev: 40             # camera elevation (35-45 deg, table-plane up)
  display_crop_radius: 0.4   # display geometry is cropped to this radius
                             # around the changed region (metres)
  viewer_crop_radius: 0.4    # viewer.html default crop ("full scene" toggle)
  chrome_gif: true           # render the GIF from viewer.html with headless
                             # Chrome (matches the interactive viewer);
                             # falls back to matplotlib if Chrome is missing
  gif_frames: 24             # frames in the rotating change.gif
  gif_width: 1100            # GIF/viewport size: taller than wide enough that
  gif_height: 820            # the 3D panel is not a letterbox strip
  export_mesh: true          # colored TSDF mesh -> scene_mesh.ply (<= 10 MB)
  export_viewer: true        # self-contained HTML viewer -> viewer.html

gpu:
  vlm_gpus: 2                # Qwen3-VL-32B bf16 needs ~2 A100s
  dtype: bfloat16
  torch_cuda: cu126          # never cu130 - driver max is CUDA 12.3 (see gpu.md)
